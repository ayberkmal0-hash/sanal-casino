<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanal Casino</title>
<style>body{font-family:system-ui;margin:0;background:#111;color:white}.wrap{max-width:520px;margin:auto;padding:20px}.card{background:#1d1d1f;border-radius:20px;padding:18px;margin:14px 0}.bal{font-size:26px;font-weight:700}.slots{text-align:center;font-size:45px;padding:15px}button,input{font:inherit;padding:12px;margin:5px;border:0;border-radius:12px}button{font-weight:700}input{width:90px;background:#333;color:white}.msg{text-align:center;min-height:25px}</style></head>
<body><div class="wrap"><h1>🎰 Sanal Casino</h1><div class="card"><div>🇹🇷 Tamamen sanal para</div><div class="bal">💰 <span id="b">1000</span> 🪙</div></div>
<div class="card"><h2>🎰 Slot</h2><div id="s" class="slots">🍒 🍋 ⭐</div><input id="sb" type="number" value="50" min="1"><button onclick="slot()">Çevir</button><div id="sm" class="msg"></div></div>
<div class="card"><h2>🪙 Yazı-Tura</h2><input id="cb" type="number" value="50" min="1"><button onclick="coin('Yazı')">Yazı</button><button onclick="coin('Tura')">Tura</button><div id="cm" class="msg"></div></div>
<div class="card"><h2>🎲 Zar</h2><input id="db" type="number" value="50" min="1"><button onclick="dice()">Zar At</button><div id="dm" class="msg"></div></div>
<div class="card"><button onclick="daily()">🎁 Günlük +250</button><button onclick="resetGame()">🔄 Sıfırla</button></div></div>
<script>
let balance=+localStorage.getItem('balance')||1000,lastDaily=+localStorage.getItem('daily')||0;
const E=['🍒','🍋','⭐','🔔','💎'];
function save(){localStorage.setItem('balance',balance);b.textContent=balance}
function bet(id){let n=Math.floor(+document.getElementById(id).value);return n>=1&&n<=balance?n:null}
function slot(){let x=bet('sb');if(!x)return sm.textContent='Geçerli bir bahis gir.';balance-=x;let a=[0,1,2].map(()=>E[Math.floor(Math.random()*E.length)]);s.textContent=a.join(' ');let w=a[0]==a[1]&&a[1]==a[2]?x*5:(a[0]==a[1]||a[1]==a[2]||a[0]==a[2]?x*2:0);balance+=w;sm.textContent=w?'🎉 +'+w+' 🪙 kazandın!':'😅 Kaybettin.';save()}
function coin(c){let x=bet('cb');if(!x)return cm.textContent='Geçerli bir bahis gir.';let r=Math.random()<.5?'Yazı':'Tura';balance+=r==c?x:-x;cm.textContent=r==c?'🪙 +'+x+' 🪙':'🪙 -'+x+' 🪙';save()}
function dice(){let x=bet('db');if(!x)return dm.textContent='Geçerli bir bahis gir.';let n=1+Math.floor(Math.random()*6);balance+=n>=4?x:-x;dm.textContent='🎲 '+n+' geldi: '+(n>=4?'+':'-')+x+' 🪙';save()}
function daily(){if(Date.now()-lastDaily<86400000)return alert('⏳ Günlük ödülünü daha sonra alabilirsin.');balance+=250;lastDaily=Date.now();localStorage.setItem('daily',lastDaily);save();alert('🎁 250 🪙 aldın!')}
function resetGame(){balance=1000;localStorage.setItem('balance',1000);save()}
save();
</script></body></html>
